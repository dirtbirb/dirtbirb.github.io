# Projects
- name: SegmentEveryGrain
  duration: 2024 - Present
  url: "https://github.com/dirtbirb/segmenteverygrain"
  summary: Machine learning for fluvial sediment analysis
  details: Adapting machine learning (ML) techniques from Dr. Zoltan Sylvester (UT Austin) to efficiently measure grain sizes from drone videos of riverbeds with Dr. Emma Lodes (Arizona State). Created interactive GUI, trained ML model, set up remote CUDA-enabled Jupyter server, and instructed users.
  skills: Python, Keras, PyTorch, Tensorflow, Matplotlib
  open: false

- name: Jelli.Fit
  duration: 2024 - Present
  url: "https://github.com/dirtbirb/jelli.fit"
  summary: Open-source event and venue scheduling
  details: Adding location-finding functionality and theming to scheduling application Crab.Fit by developer Ben Grant. Allows users to enter their location and availability, creating a graph of available times and suggesting a venue based on user preferences. Built with Axum and React, hosted on cloud services Vercel and Fly.io, relying on the Google Maps API.
  skills: Rust, Javascript, API
  open: false

- name: Dual Coincidence
  duration: 2021
  url: "https://andycavatorta.com/dual.html"
  summary: Interactive art project
  details: Assisted artist Andy Cavatorta with final construction and troubleshooting of an elaborate mechanical game meant to educate players on economic concepts. Installed in the museum of the Central Bank of Mexico. Machine control was performed using a bank of networked Raspberry Pi microcontrollers.
  skills: Python, Linux, Raspberry Pi, Spanish
  open: false

